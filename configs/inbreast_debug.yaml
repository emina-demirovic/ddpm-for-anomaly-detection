# DDPM anomaly detection configuration

dataset:
  name: INBreast
  datasets_dir: datasets
  image_size: 256
  image_channels: 1
  center: true
  normal_split: 0.8
  anomal_split: 0.99

dataloader:
  num_workers: 2
  train_batch_size: 2
  validation_batch_size: 1

model:
  # U-Net used as the denoising network in the diffusion model.
  center_input_sample: false
  time_embedding_type: positional
  freq_shift: 0
  flip_sin_to_cos: true

  down_block_types:
    - DownBlock2D
    - AttnDownBlock2D
    - AttnDownBlock2D
    - AttnDownBlock2D

  up_block_types:
    - UpBlock2D
    - AttnUpBlock2D
    - AttnUpBlock2D
    - AttnUpBlock2D

  block_out_channels:
    - 128
    - 256
    - 256
    - 512

  layers_per_block: 2
  mid_block_scale_factor: 1
  downsample_padding: 1
  downsample_type: conv
  upsample_type: conv
  dropout: 0.0
  act_fn: silu
  attention_head_dim: 8
  norm_num_groups: 32
  norm_eps: 1e-05
  resnet_time_scale_shift: default
  class_embed_type: null

diffusion:
  prediction_type: epsilon
  noise_offset: 0.1
  input_perturbation: 0.0
  validation_timesteps: 5
  validation_guidance: 0.0

restoration_tasks:
  # Task ids used during training:
  # 2 = sink deformation
  # 3 = source deformation
  # 4 = intensity change
  train_task_ids:
    - 2
    - 3
    - 4

  intensity_task_scale: 0.1
  min_push_dist: 0.5
  max_push_dist: 5.0
  use_noise_task: true
  use_threshold: 0.225
  p_no_aug: 0.0

training:
  max_train_steps: 10
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  mixed_precision: fp16
  allow_tf32: true
  use_ema: true
  resume_from_checkpoint: latest
  seed: 42

optimizer:
  learning_rate: 1e-4
  scale_lr: false
  lr_scheduler: constant
  lr_warmup_steps: 500
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-2
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  use_8bit_adam: false
  snr_gamma: 1.0

evaluation:
  mini_eval_size: 10
  balanced_mini_eval: true
  validation_samples: 1
  compute_pixel_metrics: true
  compute_sample_metrics: true

checkpointing:
  output_dir: experiments/inbreast_debug
  checkpointing_steps: 5
  checkpoints_total_limit: 2

results:
  results_dir: results
  save_anomaly_maps: true
  save_scores: true
  save_visualizations: true